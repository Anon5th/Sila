name: Publish images to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: contracts
            context: ./contracts
          - service: engine
            context: ./engine
          - service: mock-bank
            context: ./mock-bank

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The Rust engine build is large; default GitHub runners only ship
      # ~14 GB free disk, which Cargo + Buildx layers can exhaust. Reclaim
      # ~30 GB by purging unused tools (Android, GHC, dotnet) before build.
      - name: Free disk space (engine only)
        if: matrix.service == 'engine'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercased)
        id: name
        shell: bash
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${owner_lc}/sila-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          # linux/amd64 only — runs natively on Intel/AMD and on Apple
          # Silicon via Rosetta 2. Cross-compiling Rust under QEMU arm64
          # exceeds Actions runner limits (memory/time).
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

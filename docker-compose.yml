services:
  hardhat:
    build:
      context: ./contracts
    image: sila-contracts:latest
    container_name: sila-hardhat
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' http://localhost:8545 | grep -q result"
      interval: 4s
      timeout: 3s
      start_period: 8s
      retries: 30

  deployer:
    image: sila-contracts:latest
    container_name: sila-deployer
    depends_on:
      hardhat:
        condition: service_healthy
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "localhost"]
    environment:
      - RPC_URL=http://hardhat:8545
      - CONTRACT_OUT_DIR=/contract-out
    volumes:
      - contract-out:/contract-out
    restart: "no"

  engine:
    build:
      context: ./engine
    container_name: sila-engine
    depends_on:
      deployer:
        condition: service_completed_successfully
    environment:
      - RPC_URL=http://hardhat:8545
      - CONTRACT_FILE=/contract-out/sila.json
      - LISTEN=0.0.0.0:8080
      - RUST_LOG=sila_engine=info,tower_http=info
    ports:
      - "8080:8080"
    volumes:
      - contract-out:/contract-out:ro

  mock-bank:
    build:
      context: ./mock-bank
    container_name: sila-mock-bank
    depends_on:
      engine:
        condition: service_healthy
    environment:
      - ENGINE_URL=http://engine:8080
      - PORT=3000
      - TEMPLE_PROMPTPAY_ID=0899999999
    ports:
      - "3000:3000"

volumes:
  contract-out:

[package]
name = "sila-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
alloy = { version = "0.8", features = [
    "providers",
    "rpc-client",
    "rpc-types-eth",
    "signer-local",
    "network",
    "contract",
    "sol-types",
    "transports",
    "transport-http",
    "reqwest",
] }

[profile.release]
opt-level = 3
lto = "thin"
